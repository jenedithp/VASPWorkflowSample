name: VASP Workflow Example

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vasp-pages
  cancel-in-progress: true

jobs:
  validate-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate sample output and build dashboard
        run: |
          mkdir -p build
          python tools/vasp_report.py \
            examples/sample_OUTCAR \
            --json build/vasp_report.json \
            --html build/vasp_dashboard.html
          cp build/vasp_dashboard.html build/index.html

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vasp-workflow-report
          path: build/
          if-no-files-found: error

      - name: Prepare GitHub Pages dashboard
        if: github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'master'
    needs: validate-and-report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
